<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Stand-in for a generated still, so the image slot can be built and verified
    before any real asset exists (CLAUDE.md: the site must build and pass its
    checks with placeholders).

    Deliberately built to the same constraints as the real thing, because it is
    the constraints that are being tested here, not the picture:
      - pure #000000 backdrop, so mix-blend-mode: screen cancels it exactly
        (docs/IMAGE-STYLE.md §05 — a near-black leaves a visible lifted
        rectangle, and only exact black disappears)
      - 1:1
      - subject held in the mid-to-light range (bone, ochre, umber), because
        screen lifts dark tones toward transparency inside the subject too
    The graded wedge at the bottom is not decoration: it runs #000 to near-white
    so the lifting behaviour is visible at a glance against any era ground. The
    left end should vanish completely; the right end should stay solid.
  -->
  <rect width="512" height="512" fill="#000000"/>

  <g fill="none" stroke="#c9bda6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 268 C 168 196, 262 172, 330 208 C 372 230, 386 268, 372 300 C 352 344, 268 360, 200 336 C 156 320, 130 296, 128 268 Z"/>
    <path d="M330 208 C 360 186, 392 180, 412 190"/>
    <path d="M200 336 C 196 366, 210 392, 236 404"/>
  </g>

  <g fill="#a4977c">
    <circle cx="316" cy="230" r="11"/>
    <path d="M150 274 q 54 -34 112 -30 q -58 22 -112 30 Z"/>
  </g>

  <g stroke="#6b6255" stroke-width="4" stroke-linecap="round">
    <path d="M186 250 l 22 44"/>
    <path d="M226 234 l 20 52"/>
    <path d="M268 226 l 16 56"/>
  </g>

  <!-- value wedge: black at the left, near-white at the right -->
  <defs>
    <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
  </defs>
  <rect x="128" y="438" width="256" height="14" fill="url(#wedge)"/>

  <g fill="#8f8b83" font-family="sans-serif" font-size="19" letter-spacing="4" text-anchor="middle">
    <text x="256" y="424">PLACEHOLDER</text>
  </g>
</svg>
