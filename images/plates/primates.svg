  <!--
    What is actually known at this node: jaw fragments, a few teeth, and isolated ankle bones. There is no skull and no body.

    A schematic stand-in, not a reconstruction and not generated: no still
    exists for this node yet. Drawn to the same constraints as a real still
    (pure #000000 ground for the screen blend, 1:1, mid-to-light values) so the
    plate reads as a plate rather than as a gap. src/plate-image.ts tags it
    "Illustration · not a reconstruction" rather than giving it the node's
    evidence bucket, because claiming fossil support for a diagram would be a
    false claim about evidence.

    That caption is the only label. An earlier version also drew the word
    ILLUSTRATION into the picture, which put the same word twice in a row on
    the rendered plate — visible on the page, invisible in the diff.
  -->
